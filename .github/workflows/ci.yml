name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Pinned: validator checks change between Claude Code versions.
      - run: npm install --global @anthropic-ai/claude-code@2.1.303
      - run: claude plugin validate . --strict
      - run: claude plugin validate plugins/epikloop --strict
      - run: claude plugin validate plugins/epikloop-harbor --strict
      - run: node plugins/epikloop/bin/guard.mjs --self-test
      - run: claude plugin test plugins/epikloop
      - run: node plugins/epikloop/bin/fold.mjs --self-test
      - run: node plugins/epikloop/templates/githooks/check.mjs --self-test

  floor:
    name: gate runner on node 22.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The floor itself: a later 22.x or 24 accepts language features 22.0.0 lacks.
          node-version: 22.0.0
      - run: node plugins/epikloop/templates/githooks/check.mjs --self-test
