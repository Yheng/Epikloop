name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, which the sign-off and AI-credit laws read.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Pinned: validator checks change between Claude Code versions.
      - run: npm install --global @anthropic-ai/claude-code@2.1.303
      - run: claude plugin validate . --strict
      - run: claude plugin validate plugins/epikloop --strict
      - run: claude plugin validate plugins/epikloop-harbor --strict
      - run: node plugins/epikloop/scripts/guard.mjs --self-test
      - run: node plugins/epikloop/scripts/brief.mjs --self-test
      - run: node plugins/epikloop/scripts/init.mjs --self-test
      - run: node plugins/epikloop/scripts/state.mjs --self-test
      - run: node plugins/epikloop/scripts/smoke.mjs --self-test
      - run: node plugins/epikloop/scripts/doctor.mjs --self-test
      - run: node plugins/epikloop/scripts/switch.mjs --self-test
      - run: node plugins/epikloop/scripts/gallery.mjs --self-test
      - run: claude plugin test plugins/epikloop
      - run: node plugins/epikloop/scripts/fold.mjs --self-test
      - run: node plugins/epikloop/templates/githooks/check.mjs --self-test
      # Harbor's plugin as it ships: its start-of-session hook and the build copied from Harbor,
      # served from a throwaway home on each system.
      - run: node tools/harbor.mjs
      # The eval suite's fixtures and runner, neither of which makes a model call. The suite itself
      # runs on a contributor's machine under their own Claude Code login, so no credential is
      # stored here.
      - run: node plugins/epikloop/evals/fixture.mjs --self-test
      - run: node tools/evals.mjs --self-test
      - run: node tools/laws.mjs --self-test
      - run: node tools/laws.mjs

  mutations:
    name: mutations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The emitter's mutations run its suite through claude plugin test.
      - run: npm install --global @anthropic-ai/claude-code@2.1.303
      - run: node tools/mutate.mjs --self-test
      - run: node tools/mutate.mjs

  floor:
    name: gate runner on node 22.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The floor itself: a later 22.x or 24 accepts language features 22.0.0 lacks.
          node-version: 22.0.0
      - run: node plugins/epikloop/templates/githooks/check.mjs --self-test
