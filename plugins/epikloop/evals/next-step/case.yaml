schema_version: "1.1"
name: next-step
description: A plain question about the next step gets epic 1 from the briefing or the state script, not from reading the project files.
tags: [briefing]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "What's the next step for this project?"
  model: claude-sonnet-5-5
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: names-epic-1
    type: regex
    pattern: 'epic 1\b'
  - name: reads-no-project-file
    type: tool_used
    tool: Read
    input_match: 'docs[/\\]+stories|[/\\]spec[/\\]|\.epikloop[/\\]'
    min: 0
    max: 0
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
