schema_version: "1.1"
name: plan
description: /epikloop:plan, with the human's decisions given up front, writes tiered stories, freezes the MVP set, records the mode and hours, and commits.
tags: [plan]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/epikloop:plan The human''s decisions, given up front: every story you propose is in the MVP set; solo mode; 2 hours a day; no deadline. They are confirmed, so record them and commit without asking.'
  model: claude-sonnet-5-5
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: freezes-the-mvp
    type: regex
    target: { source: file, path: .epikloop/project.json }
    pattern: '"mvp_frozen":\s*"\d{4}-\d{2}-\d{2}"'
  - name: records-solo-mode
    type: regex
    target: { source: file, path: .epikloop/project.json }
    pattern: '"mode":\s*"solo"'
  - name: records-the-hours
    type: regex
    target: { source: file, path: .epikloop/project.json }
    pattern: '"hours_per_day":\s*2\b'
  - name: writes-story-1-1
    type: tool_used
    tool: Write
    input_match: 'docs[/\\]+stories[/\\]+.*## 1\.1 '
  - name: tiers-the-stories
    type: tool_used
    tool: Write
    input_match: 'docs[/\\]+stories[/\\]+.*- Tier: T[123]'
  - name: commits
    type: regex
    target: { source: file, path: .git/logs/HEAD }
    pattern: '\tcommit: (?!fixture: )'
