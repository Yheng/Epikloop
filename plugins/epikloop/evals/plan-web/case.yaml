schema_version: "1.1"
name: plan-web
description: /epikloop:plan, on a web project with a complete design, has a story load the design's tokens and builds its screens to their designs, and lands the plan.
tags: [plan]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/epikloop:plan The human''s decisions, given up front: every story you propose is in the MVP set; solo mode; 2 hours a day; no deadline. They are confirmed, so record them and commit without asking.'
  model: claude-sonnet-5-5
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: freezes-the-mvp
    type: regex
    target: { source: file, path: .epikloop/project.json }
    pattern: '"mvp_frozen":\s*"\d{4}-\d{2}-\d{2}"'
  - name: loads-the-tokens
    type: regex
    target: { source: file, path: 'docs/stories/*.md' }
    pattern: 'tokens\.css'
  - name: builds-to-the-design
    type: regex
    target: { source: file, path: 'docs/stories/*.md' }
    pattern: 'design/screens/'
  - name: commits
    type: regex
    target: { source: file, path: .git/logs/HEAD }
    pattern: '\tcommit: (?!fixture: )'
  - name: lands
    type: regex
    target: { source: file, path: .git/logs/refs/remotes/origin/main }
    pattern: '\tupdate by push'
