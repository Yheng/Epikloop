schema_version: "1.1"
name: design-model
description: /epikloop:design, in a project whose marker names a drawing model, has subagents started on that model draw the screens, keeps the tokens and the manifest itself, and lands the design.
tags: [design]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /epikloop:design
  model: claude-sonnet-5-5
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: runs-the-design-script
    type: tool_used
    tool: Bash
    input_match: 'state\.mjs.*--design'
  - name: starts-a-drawer-on-the-model
    type: tool_used
    tool: Agent
    input_match: '"model":"haiku"'
  - name: starts-none-on-another
    type: tool_used
    tool: Agent
    input_match: '"model":"(?!haiku")'
    min: 0
    max: 0
  - name: writes-the-tokens
    type: file_exists
    path: design/tokens.css
  - name: lists-a-screen
    type: regex
    target: { source: file, path: design/manifest.md }
    pattern: '^## [a-z0-9][a-z0-9-]* \S'
    flags: m
  - name: draws-a-default-state
    type: file_exists
    path: 'design/screens/*.html'
  - name: writes-the-gallery
    type: file_exists
    path: design/index.html
  - name: commits
    type: regex
    target: { source: file, path: .git/logs/HEAD }
    pattern: '\tcommit: (?!fixture: )'
  - name: lands
    type: regex
    target: { source: file, path: .git/logs/refs/remotes/origin/main }
    pattern: '\tupdate by push'
