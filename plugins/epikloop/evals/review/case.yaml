schema_version: "1.1"
name: review
description: /epikloop:epic 1 finds no story left to build, has a reviewer read the story that landed, and pushes the review's record, a question holding its finding, with no code changed.
tags: [batch, review]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /epikloop:epic 1
  model: claude-sonnet-5-5
  max_turns: 20
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite]
graders:
  - name: spawns-the-reviewer
    type: tool_used
    tool: Agent
    input_match: 'epikloop:story-reviewer'
  - name: passes-the-review-effort
    type: tool_used
    tool: Agent
    input_match: '"effort":"(?:low|medium|high|xhigh|max)"'
  - name: spawns-no-worker
    type: tool_used
    tool: Agent
    input_match: 'epikloop:story-worker'
    min: 0
    max: 0
  - name: lands-the-review
    type: regex
    target: { source: file, path: .git/logs/HEAD }
    pattern: '\tcommit: review\(1\.1\): \d+ findings?'
  - name: parks-review-1-1
    type: regex
    target: { source: file, path: docs/queue.md }
    pattern: '### Q-\d{3} Review 1\.1 \(\d{4}-\d{2}-\d{2}\)'
  - name: names-the-file-and-line
    type: regex
    target: { source: file, path: docs/queue.md }
    pattern: 'src/greet\.mjs:\d+'
  - name: marks-it-high
    type: regex
    target: { source: file, path: docs/queue.md }
    pattern: '- Severity: high'
  - name: pushes-the-review
    type: regex
    target: { source: file, path: .git/logs/refs/remotes/origin/main }
    pattern: 'update by push\n[^\n]*update by push'
  - name: fixes-nothing
    type: regex
    target: { source: file, path: src/greet.mjs }
    pattern: 'throw|Error'
    match: not_contains
  - name: reports-the-review
    type: regex
    pattern: '1\.1\b[^\n]*(?:review|finding)'
    flags: i
