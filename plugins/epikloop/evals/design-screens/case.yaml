schema_version: "1.1"
name: design-screens
description: /epikloop:design, after the human's pick, writes the tokens, the manifest and every screen state, frames them in the gallery, and lands them.
tags: [design]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /epikloop:design
  model: claude-sonnet-5-5
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: runs-the-design-script
    type: tool_used
    tool: Bash
    input_match: 'state\.mjs.*--design'
  - name: writes-the-tokens
    type: file_exists
    path: design/tokens.css
  - name: lists-a-screen
    type: regex
    target: { source: file, path: design/manifest.md }
    pattern: '^## [a-z0-9][a-z0-9-]* \S'
    flags: m
  - name: lists-its-states
    type: regex
    target: { source: file, path: design/manifest.md }
    pattern: '^- States: default\b'
    flags: m
  - name: draws-a-default-state
    type: file_exists
    path: 'design/screens/*.html'
  - name: draws-another-state
    type: file_exists
    path: 'design/screens/*.*.html'
  - name: writes-the-gallery
    type: file_exists
    path: design/index.html
  - name: commits
    type: regex
    target: { source: file, path: .git/logs/HEAD }
    pattern: '\tcommit: (?!fixture: )'
  - name: lands
    type: regex
    target: { source: file, path: .git/logs/refs/remotes/origin/main }
    pattern: '\tupdate by push'
