schema_version: "1.1"
name: decide
description: /epikloop:decide records the human's answer as the next decision, takes the question off the queue, and commits.
tags: [decide]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/epikloop:decide My answer to Q-001 is to keep the default. That is the decision, so record it and commit without asking anything else.'
  model: claude-sonnet-5-5
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: records-decision-002
    type: regex
    target: { source: file, path: docs/decisions.md }
    pattern: '## DECISION-002 '
  - name: answers-q-001
    type: regex
    target: { source: file, path: docs/decisions.md }
    pattern: '- Answers: Q-001'
  - name: clears-the-queue
    type: regex
    target: { source: file, path: docs/queue.md }
    pattern: 'Q-001'
    match: not_contains
  - name: commits
    type: regex
    target: { source: file, path: .git/logs/HEAD }
    pattern: '\tcommit: (?!fixture: )'
  - name: changes-no-code
    type: tool_used
    tool: Write
    input_match: 'src[/\\]+'
    min: 0
    max: 0
