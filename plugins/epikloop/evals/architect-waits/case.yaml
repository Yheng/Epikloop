schema_version: "1.1"
name: architect-waits
description: /epikloop:architect proposes the stack and the lane, and writes nothing until the human confirms both.
tags: [architect]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /epikloop:architect
  model: claude-sonnet-5-5
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: commits-nothing
    type: regex
    target: { source: file, path: .git/logs/HEAD }
    pattern: '\tcommit: (?!fixture: )'
    match: not_contains
  - name: proposes-the-service-lane
    type: regex
    pattern: '\bservice\b'
    flags: i
  - name: waits-for-confirmation
    type: regex
    pattern: '\?|\bconfirm'
    flags: i
